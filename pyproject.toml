[project]
name = "incident-response-evidence-kit"
version = "1.0.0"
description = "Local, bounded evidence integrity and private incident timelines by Jason Stys"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["irkit"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["irkit"]
[tool.coverage.report]
fail_under = 95
show_missing = true
